name: CI - EcoColeta

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "EcoColeta@123"
        ports:
          - 1433:1433

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=EcoColetaDb;User Id=sa;Password=EcoColeta@123;TrustServerCertificate=True;"

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restaurar dependencias
        run: dotnet restore EcoColeta.Api.csproj

      - name: Restaurar dependencias dos testes
        run: dotnet restore EcoColeta.Tests/EcoColeta.Tests.csproj

      - name: Instalar ferramenta EF Core
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Aplicar migrations no banco de testes
        run: dotnet ef database update --project EcoColeta.Api.csproj

      - name: Compilar projeto
        run: dotnet build EcoColeta.Api.csproj --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test EcoColeta.Tests/EcoColeta.Tests.csproj --configuration Release --no-restore